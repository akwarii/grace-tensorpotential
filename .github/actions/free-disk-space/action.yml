name: Free disk space
description: >
  Deletes preinstalled software that the jobs never use, to make room for the CUDA wheels of TensorFlow and torch
  and for the checkpoints that the training tests write (CI2). Prints the free space before and after.

runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/lib/android \
          /usr/local/share/chromium /opt/microsoft /opt/google
        df -h /
