# TEMPORARY (CI4, task 4): wall time and peak memory of each test-tf shard (coverage on) with the regenerated durations.
# Removed from the branch before the pull request is marked ready; the numbers go into the pull request.

name: Measure shards

on:
  pull_request:
    paths:
      - ".github/workflows/measure-shards.yaml"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.5"

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: shard ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install the development environment
        run: uv sync --frozen --group dev
      - name: Run the shard with a memory sampler (same step as pytest, so the lines survive a dead runner)
        env:
          GROUP: ${{ matrix.group }}
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          ( while true; do echo "MEM $(date +%s) used_mb=$(free -m | awk '/Mem:/{print $3}') avail_mb=$(free -m | awk '/Mem:/{print $7}')"; sleep 10; done ) &
          sampler=$!
          args=( tests -p no:cacheprovider --timeout=900 -n 2 --dist load --splits 4 --group "$GROUP"
                 --splitting-algorithm=least_duration --durations-path=tests/.test_durations
                 --ignore=tests/test_structured_grid.py --ignore=tests/test_foundation_model_regression.py -q )
          args+=( --cov=tensorpotential --cov-branch --cov-report= )
          start=$(date +%s)
          set +e
          .venv/bin/python -m pytest "${args[@]}"
          rc=$?
          end=$(date +%s)
          kill "$sampler" 2>/dev/null
          echo "WALL_SECONDS $((end - start))"
          exit $rc
