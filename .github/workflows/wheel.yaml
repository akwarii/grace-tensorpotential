# The wheel and the extras (CI1, D17a), on every pull request and every push to the integration branch:
#   wheel           builds the wheel, checks its file list and metadata against upstream and the declared extras
#   wheel-smoke     installs the wheel into a clean venv (base, torch, tf) and runs the smoke test, on Python 3.11 and 3.13
#   extras-resolve  resolves each extra with uv, on Python 3.11 and 3.13; an empty extra fails
# Every action is pinned to a commit; the token has read access only.

name: Wheel

on:
  pull_request:
  push:
    branches: [torch-backend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheel-${{ github.workflow }}-${{ github.ref }}
  # a push to the integration branch is never cancelled by the next one; a pull request run is
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.5"

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Build the wheel
        id: build
        run: |
          uv build --wheel --out-dir dist
          echo "wheel=$(ls dist | grep '\.whl$')" >> "$GITHUB_OUTPUT"
      - name: Install pytest for the wheel checks
        run: |
          uv venv .venv-check
          uv pip install --python .venv-check/bin/python pytest pytest-timeout
      - name: Check the wheel (file list against upstream, metadata, extras)
        # --noconftest: tests/conftest.py imports TensorFlow, which the packaging tests do not need
        uses: ./.github/actions/run-pytest
        with:
          python: .venv-check/bin/python
          tests: tests/test_packaging.py
          extra-args: --noconftest
        env:
          TENSORPOTENTIAL_WHEEL: ${{ github.workspace }}/dist/${{ steps.build.outputs.wheel }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  wheel-smoke:
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        extra: ["none", "torch", "tf"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - if: matrix.extra == 'tf'
        uses: ./.github/actions/free-disk-space
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheel
          path: dist
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
      - name: Install the wheel into a clean venv
        run: |
          uv venv --python ${{ matrix.python }} ../clean-venv
          if [ "${{ matrix.extra }}" = none ]; then target="$(ls "$PWD"/dist/*.whl)"; else target="$(ls "$PWD"/dist/*.whl)[${{ matrix.extra }}]"; fi
          uv pip install --python ../clean-venv/bin/python "$target"
      - name: Smoke test (core imports, --help of the ten console scripts)
        run: |
          expect=no-tf; if [ "${{ matrix.extra }}" = tf ]; then expect=tf; fi
          python3 tools/wheel_smoke.py ../clean-venv/bin/python --expect "$expect"

  extras-resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        extra: ["tf", "torch", "torch-sim", "all"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Resolve the extra (fails when its list is empty or a requirement is not resolved)
        run: python3 tools/resolve_extras.py --python-version ${{ matrix.python }} ${{ matrix.extra }}
