# The test suites (CI1, D17a), on every pull request, every push to the integration branch and every night:
#   test-core   tests/core (the TensorFlow-free shared code) in an environment without TensorFlow
#   test-torch  the TF-free torch-backend tests on pandas 2.3 and 3.0 (runs once tests_torch/ has tests)
#   test-tf     the TensorFlow suite, in four shards that each write their coverage data
#   quality-gates  combines the coverage data of the shards and runs the coverage ratchet (every run) and the
#               touched-unit gate (pull requests only) (CI3)
# GitHub starts scheduled workflows from the default branch only, so the nightly run is live once this file is there.
# Every action is pinned to a commit; the token has read access only.

name: Tests

on:
  pull_request:
  push:
    branches: [torch-backend]
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  # a push to the integration branch is never cancelled by the next one; a pull request run is
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.5"

jobs:
  test-core:
    # The TensorFlow-free tests of tensorpotential/core in an environment that has no TensorFlow at all:
    # the base installation of the package plus pytest. --noconftest: tests/conftest.py imports TensorFlow.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install the base package (no extra) and pytest
        run: |
          uv venv .venv-core
          uv pip install --python .venv-core/bin/python . pytest pytest-timeout
      - name: Check that TensorFlow is absent
        run: .venv-core/bin/python -c "import importlib.util as u, sys; sys.exit(u.find_spec('tensorflow') is not None)"
      - name: Run tests/core without TensorFlow
        uses: ./.github/actions/run-pytest
        with:
          python: .venv-core/bin/python
          tests: tests/core
          extra-args: --noconftest -W always

  test-torch:
    # Defined here, switched on by TORCH1, which creates tests_torch/ (the job is skipped while it has no test file).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pandas: ["2.3.3", "3.0.3"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: has-tests
        name: Look for tests_torch/ tests
        run: |
          if compgen -G "tests_torch/test_*.py" > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has-tests.outputs.found == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - if: steps.has-tests.outputs.found == 'true'
        name: Install the torch extra without TensorFlow, then pin pandas
        run: |
          uv venv .venv-torch
          uv pip install --python .venv-torch/bin/python ".[torch]" pytest pytest-timeout
          uv pip install --python .venv-torch/bin/python "pandas==${{ matrix.pandas }}"
      - if: steps.has-tests.outputs.found == 'true'
        name: Check that TensorFlow is absent
        run: .venv-torch/bin/python -c "import importlib.util as u, sys; sys.exit(u.find_spec('tensorflow') is not None)"
      - if: steps.has-tests.outputs.found == 'true'
        name: Run tests_torch without TensorFlow
        uses: ./.github/actions/run-pytest
        with:
          python: .venv-torch/bin/python
          tests: tests_torch
          extra-args: -W always

  test-tf:
    # The TensorFlow suite of the repository (tests/ with the two usual ignores), in groups of about equal duration
    # (pytest-split, tests/.test_durations) with two xdist workers each: one TensorFlow worker holds several GB, and a
    # hosted runner has about 16 GB. Regenerate the durations with the command in CLAUDE.md after a large change.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: test-tf (group ${{ matrix.group }} of 4)
    env:
      # one data file per shard; pytest-cov merges the xdist workers into it and quality-gates combines the four
      COVERAGE_FILE: .coverage.group-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install the development environment (the dev group includes the tf extra)
        run: uv sync --frozen --group dev
      - name: Run this group of the TensorFlow suite
        uses: ./.github/actions/run-pytest
        with:
          python: .venv/bin/python
          path-prepend: ${{ github.workspace }}/.venv/bin
          tests: tests
          numprocs: "2"
          splits: "4"
          group: ${{ matrix.group }}
          extra-args: --ignore=tests/test_structured_grid.py --ignore=tests/test_foundation_model_regression.py --cov=tensorpotential --cov-branch --cov-report=
      - name: Upload the coverage data of this shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-group-${{ matrix.group }}
          path: .coverage.group-${{ matrix.group }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  quality-gates:
    # The coverage gates of CLAUDE.md, run on the data of the four shards (CI3): the per-file ratchet against
    # baselines/coverage_baseline.json on every run and, on a pull request, the 90% rule for the units it touches.
    needs: test-tf
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # the touched-unit gate diffs against the base branch, so it needs its history
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install coverage.py (the version of uv.lock; the tools use the standard library otherwise)
        run: |
          uv venv .venv-gates
          uv pip install --python .venv-gates/bin/python coverage==7.16.2
      - name: Download the coverage data of the shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-group-*
          path: coverage-data
          merge-multiple: true
      - name: Combine the shards into one report
        run: |
          .venv-gates/bin/python -m coverage combine coverage-data
          .venv-gates/bin/python -m coverage json -o cov.json
          .venv-gates/bin/python -m coverage report --skip-empty | tail -n 3
      - name: Coverage ratchet (no file may lose share and gain uncovered code)
        run: .venv-gates/bin/python tools/coverage_ratchet.py check cov.json
      - name: Touched units at 90 percent (pull requests)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .venv-gates/bin/python tools/check_touched_coverage.py --coverage cov.json --base "origin/$BASE_REF"
