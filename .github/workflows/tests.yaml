# The test suites (CI1, D17a), on every pull request, every push to the integration branch and every night:
#   test-core   tests/core (the TensorFlow-free shared code) in an environment without TensorFlow
#   test-torch  the TF-free torch-backend tests on pandas 2.3 and 3.0 (runs once tests_torch/ has tests)
#   test-tf     the TensorFlow suite
# GitHub starts scheduled workflows from the default branch only, so the nightly run is live once this file is there.
# Every action is pinned to a commit; the token has read access only.

name: Tests

on:
  pull_request:
  push:
    branches: [torch-backend]
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  test-core:
    # The TensorFlow-free tests of tensorpotential/core in an environment that has no TensorFlow at all:
    # the base installation of the package plus pytest. --noconftest: tests/conftest.py imports TensorFlow.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install the base package (no extra) and pytest
        run: |
          uv venv .venv-core
          uv pip install --python .venv-core/bin/python . pytest
      - name: Run tests/core without TensorFlow
        run: |
          .venv-core/bin/python -c "import importlib.util as u, sys; sys.exit(u.find_spec('tensorflow') is not None)"
          .venv-core/bin/python -m pytest --noconftest tests/core -q -p no:cacheprovider -W always

  test-torch:
    # Defined here, switched on by TORCH1, which creates tests_torch/ (the job is skipped while it has no test file).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pandas: ["2.3.3", "3.0.3"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: has-tests
        name: Look for tests_torch/ tests
        run: |
          if compgen -G "tests_torch/test_*.py" > /dev/null; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.has-tests.outputs.found == 'true'
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - if: steps.has-tests.outputs.found == 'true'
        name: Install the torch extra without TensorFlow, then pin pandas
        run: |
          uv venv .venv-torch
          uv pip install --python .venv-torch/bin/python ".[torch]" pytest
          uv pip install --python .venv-torch/bin/python "pandas==${{ matrix.pandas }}"
      - if: steps.has-tests.outputs.found == 'true'
        name: Run tests_torch without TensorFlow
        run: |
          .venv-torch/bin/python -c "import importlib.util as u, sys; sys.exit(u.find_spec('tensorflow') is not None)"
          .venv-torch/bin/python -m pytest tests_torch -q -p no:cacheprovider -W always

  test-tf:
    # The TensorFlow suite of the repository (the same selection as the local baseline, tests/ with the two usual ignores).
    # About 13 minutes on a hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install the development environment (the dev group includes the tf extra)
        run: uv sync --frozen --group dev
      # TEMPORARY DIAGNOSTICS (CI2): removed once the cause of the "runner has received a shutdown signal" failures is stated.
      - name: Run the TensorFlow suite (with the temporary memory sampler in the same step, so its lines stream into the log even if the runner dies)
        run: |
          mkdir -p "$RUNNER_TEMP/diag"
          (while true; do
            echo "[mem] $(date +%T) rss_total_mb=$(ps -eo rss= | awk '{s+=$1} END {print int(s/1024)}') $(free -m | awk 'NR==2 {print "used_mb="$3" avail_mb="$7}') top=$(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%d:%s ", $1/1024, $2}')" | tee -a "$RUNNER_TEMP/diag/memory.log"
            sleep 10
          done) &
          PATH="$PWD/.venv/bin:$PATH" uv run --frozen --no-sync pytest tests -v -n 4 --dist load \
            --ignore=tests/test_structured_grid.py --ignore=tests/test_foundation_model_regression.py
      - name: Memory peak, kernel out-of-memory lines and disk (temporary diagnostics)
        if: always()
        run: |
          awk '{split($3,a,"="); if (a[2]+0>m) {m=a[2]+0; l=$0}} END {print "peak total rss (MB) line: " l}' "$RUNNER_TEMP/diag/memory.log"
          awk '{split($5,a,"="); if (min==""||a[2]+0<min) {min=a[2]+0; l=$0}} END {print "lowest available memory line: " l}' "$RUNNER_TEMP/diag/memory.log"
          echo "== last 12 samples"; tail -12 "$RUNNER_TEMP/diag/memory.log"
          echo "== kernel log (out-of-memory kills)"; sudo dmesg 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -20 || true
          echo "== free and df"; free -m; df -h / /tmp
      - name: Upload the memory log (temporary diagnostics)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-log
          path: ${{ runner.temp }}/diag/memory.log
          if-no-files-found: ignore
          retention-days: 7
