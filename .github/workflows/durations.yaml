# Regenerates the test durations that balance the four test-tf shards (CI4), weekly and on request.
#   shards  the four shards of tests.yaml (same action, two workers, coverage on), each with --store-durations
#           --clean-durations, so its file holds exactly the tests of that shard; each uploads durations-group-N
#   merge   tools/merge_durations.py joins the four files, drops the tests that no longer exist and uploads one
#           artifact, test-durations (tests/.test_durations, ready to commit), plus a summary
# Durations measured on the hosted runner with coverage on are the only ones that matched the runner (CI3 measured that
# a developer machine's are no better than the old file). The workflow neither pushes nor opens a pull request: its token
# is read-only; download the artifact and commit it on a work branch. The shards need every test to pass, so a failing
# shard stops the merge.
# GitHub starts scheduled and dispatched workflows from the default branch only, so this one is live once the file is there.

name: Durations

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durations-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.5"

jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: shard ${{ matrix.group }} of 4
    env:
      # the coverage data is not kept; the setting only keeps the data files out of the way of the tests
      COVERAGE_FILE: .coverage.durations-${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install the development environment (the dev group includes the tf extra)
        run: uv sync --frozen --group dev
      - name: Run this shard and store the durations of its tests (the split reads tests/.test_durations first, the run then overwrites it)
        uses: ./.github/actions/run-pytest
        with:
          python: .venv/bin/python
          path-prepend: ${{ github.workspace }}/.venv/bin
          tests: tests
          numprocs: "2"
          splits: "4"
          group: ${{ matrix.group }}
          extra-args: --ignore=tests/test_structured_grid.py --ignore=tests/test_foundation_model_regression.py --cov=tensorpotential --cov-branch --cov-report= --store-durations --clean-durations
      - name: Upload the durations of this shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: durations-group-${{ matrix.group }}
          path: tests/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download the durations of the four shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: durations-group-*
          path: shard-durations
      - name: Merge them (standard library only; an unusable file, a test in two shards or a missing shard fails the step)
        run: |
          ls -R shard-durations
          mkdir test-durations
          python3 tools/merge_durations.py merge --committed tests/.test_durations --out test-durations/.test_durations \
            --summary summary.md shard-durations/durations-group-1/.test_durations shard-durations/durations-group-2/.test_durations \
            shard-durations/durations-group-3/.test_durations shard-durations/durations-group-4/.test_durations
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the merged file (commit it as tests/.test_durations)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-durations
          path: test-durations/.test_durations
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
