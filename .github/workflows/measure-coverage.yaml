# TEMPORARY (CI3): per-test durations of the test-tf shards as measured on the hosted runner, with coverage on
# (what CI runs), to rebalance tests/.test_durations. Removed from the branch before the pull request is marked ready.
# Third use of this file: the shard split by the first set of durations (regenerated locally) was not better than the old one.

name: Measure coverage cost

on:
  pull_request:
    paths:
      - ".github/workflows/measure-coverage.yaml"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.5"

jobs:
  durations:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: durations shard ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install the development environment
        run: uv sync --frozen --group dev
      - name: Run the shard and store the durations of its tests
        env:
          GROUP: ${{ matrix.group }}
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          cp tests/.test_durations orig_durations.json
          .venv/bin/python -m pytest tests -p no:cacheprovider --timeout=900 -n 2 --dist load --splits 4 --group "$GROUP" \
            --splitting-algorithm=least_duration --durations-path=tests/.test_durations --store-durations \
            --ignore=tests/test_structured_grid.py --ignore=tests/test_foundation_model_regression.py -q \
            --cov=tensorpotential --cov-branch --cov-report=
          .venv/bin/python - <<'PY'
          import json
          old = json.load(open("orig_durations.json"))
          new = json.load(open("tests/.test_durations"))
          kept = {k: v for k, v in new.items() if old.get(k) != v}
          json.dump(kept, open(f"durations-group-{__import__('os').environ['GROUP']}.json", "w"), indent=0, sort_keys=True)
          print("stored", len(kept), "of", len(new))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: durations-group-${{ matrix.group }}
          path: durations-group-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 3
