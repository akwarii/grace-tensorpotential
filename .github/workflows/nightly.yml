# The slow checks of CI1 (D17a), scheduled because they are heavy on hosted runners:
#   both-stacks     one environment with the all extra: TensorFlow and torch import side by side
#   torch-sim-main  the torch extra with torch-sim from its main branch, to see an upstream break early
#   quality-report  tools/quality_report.py (TOOL4): the metrics of the library in one table (job summary), failing when
#                   one is worse than baselines/quality.json; the coverage is that of the Tests run of the same commit
# The test suites (core, torch, TensorFlow) are in tests.yaml, which also runs every night.
#
# GitHub starts scheduled workflows from the default branch only, so the schedule is live once this file is there;
# workflow_dispatch runs it by hand, and a pull request that changes this file runs it as a check of the change.
# Every action is pinned to a commit; the token has read access only.

name: Nightly

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/nightly.yml"]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  # a push to the integration branch is never cancelled by the next one; a pull request run is
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.5"

jobs:
  both-stacks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Build the wheel and install it with every extra into one venv
        run: |
          uv build --wheel --out-dir dist
          uv venv ../both-venv
          uv pip install --python ../both-venv/bin/python "$(ls "$PWD"/dist/*.whl)[all]"
      - name: torch, torch-sim and TensorFlow import in one process (torch first), the core loads none of them
        run: |
          ../both-venv/bin/python -c "
          import sys
          import tensorpotential.core, tensorpotential.functions.couplings
          assert not {'tensorflow', 'torch'} & set(sys.modules), 'the core loaded a backend'
          import torch, torch_sim, vesin, tensorflow
          print('tensorflow', tensorflow.__version__, 'torch', torch.__version__)
          "
      - name: Known issue, reported as a warning (finding of CI1) - TensorFlow imported before triton crashes
        # triton 3.8.0 (a torch dependency) segfaults in triton._C.libtriton when TensorFlow 2.20 was imported first;
        # in the other order both load. The step turns red as a warning only; delete it when the crash is gone.
        run: |
          if ../both-venv/bin/python -c "import tensorflow, triton" > /dev/null 2>&1; then
            echo "tensorflow before triton works now: remove this step and the notes of the CI1 finding"
          else
            echo "::warning::importing tensorflow before triton still crashes (exit status $?)"
          fi
      - name: Smoke test with both backends installed
        run: python3 tools/wheel_smoke.py ../both-venv/bin/python --expect tf

  torch-sim-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - name: Install the torch extra and torch-sim from its main branch
        run: |
          uv venv .venv-sim
          uv pip install --python .venv-sim/bin/python ".[torch]" pytest pytest-timeout vesin \
            "torch-sim-atomistic @ git+https://github.com/TorchSim/torch-sim.git@main"
      - name: Import torch-sim and run the torch-sim tests of this repository, if there are any
        run: |
          .venv-sim/bin/python -c "import torch_sim, torch; print('torch-sim', getattr(torch_sim, '__version__', 'main'), 'torch', torch.__version__)"
          if compgen -G "tests_torch/test_torchsim*.py" > /dev/null; then
            .venv-sim/bin/python -m pytest tests_torch -v -p no:cacheprovider --timeout=900 -k torchsim
          fi

  quality-report:
    # The coverage comes from the Tests workflow (test-tf uploads one data file and one junit file per shard): the job
    # waits for the Tests run of this commit, downloads them and combines them. A run for a change of this file
    # (pull_request) has no such run to wait for and reports without coverage. board.py lint needs a token with
    # project scope, which CI does not have, so it is not part of the report.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
      - name: Install the development environment (ruff and ty at the versions of uv.lock, coverage.py)
        run: uv sync --frozen --group dev
      - name: Download the coverage data and the junit files of the Tests run of this commit
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        # the newest Tests run of the commit, whatever started it: the schedule run of 02:10 for the nightly run, the run of
        # the push or of the pull request for a manual one; gh run watch waits for it to finish
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yaml --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::no Tests run for $SHA: run the Tests workflow on this commit first"
            exit 1
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status > /dev/null
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'coverage-group-*' --dir shards
      - name: Combine the shards into one coverage report
        if: github.event_name != 'pull_request'
        run: |
          uv run --frozen --no-sync python -m coverage combine shards/*
          uv run --frozen --no-sync python -m coverage json -o cov.json
      - name: Quality report (fails when a metric is worse than baselines/quality.json)
        env:
          # the lint baselines were recorded with PYTHONPATH on the repository root (see lint.yaml)
          PYTHONPATH: ${{ github.workspace }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            coverage_args="--no-coverage"
          else
            coverage_args="--coverage cov.json --junit shards/*/junit.group-*.xml"
          fi
          uv run --frozen --no-sync python tools/quality_report.py check $coverage_args \
            --markdown "$GITHUB_STEP_SUMMARY" --json quality.json
      - name: Keep the metrics of this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-report
          path: quality.json
          if-no-files-found: ignore
          retention-days: 90
