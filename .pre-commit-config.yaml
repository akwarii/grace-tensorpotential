# Hooks for prek (https://github.com/j178/prek); they run on the changed files only and use the
# versions pinned in the dev group of pyproject.toml: `uv sync --group dev`, then `prek install`.
# Legacy code is not linted file by file (its findings are tolerated, not fixed); tools/lint_ratchet.py
# only lets their counts fall. The strict rule set applies to the new packages and to every file that is not in
# baselines/legacy_files.txt, through the single ruff configuration of pyproject.toml; the lint-ratchet hook checks it.
repos:
  - repo: local
    hooks:
      - id: ruff-new-packages
        name: ruff, strict set (new packages)
        entry: uv run --frozen --no-sync ruff check
        language: system
        files: ^(tensorpotential/(torch_backend|core)|tests_torch)/.*\.py$
      - id: ty-new-packages
        name: ty (new packages)
        entry: uv run --frozen --no-sync ty check
        language: system
        files: ^(tensorpotential/(torch_backend|core)|tests_torch)/.*\.py$
      - id: lint-ratchet
        name: lint ratchet (legacy counts may not rise, new files are strict)
        entry: uv run --frozen --no-sync python tools/lint_ratchet.py check
        language: system
        pass_filenames: false
        files: \.(py|ipynb)$|^pyproject\.toml$|^baselines/(lint_ratchet\.json|legacy_files\.txt)$
      - id: import-contract
        name: import-linter (TensorFlow-free modules)
        entry: uv run --frozen --no-sync lint-imports
        language: system
        pass_filenames: false
        files: ^(tensorpotential/.*\.py|pyproject\.toml)$
