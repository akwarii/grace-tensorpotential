# Hooks for prek (https://github.com/j178/prek); they run on the changed files only and use the
# versions pinned in the dev group of pyproject.toml: `uv sync --group dev`, then `prek install`.
# Legacy code is not linted file by file (its findings are tolerated, not fixed); tools/lint_ratchet.py
# only lets their counts fall. The strict rule sets are in the ruff.toml of each new package.
repos:
  - repo: local
    hooks:
      - id: ruff-new-packages
        name: ruff, strict set (new packages)
        entry: uv run --frozen --no-sync ruff check
        language: system
        files: ^(tensorpotential/(torch_backend|core)|tests_torch)/.*\.py$
      - id: ty-new-packages
        name: ty (new packages)
        entry: uv run --frozen --no-sync ty check
        language: system
        files: ^(tensorpotential/(torch_backend|core)|tests_torch)/.*\.py$
      - id: lint-ratchet
        name: lint ratchet (legacy counts may not rise)
        entry: uv run --frozen --no-sync python tools/lint_ratchet.py check
        language: system
        pass_filenames: false
        files: \.(py|ipynb)$|^pyproject\.toml$|^baselines/lint_ratchet\.json$
