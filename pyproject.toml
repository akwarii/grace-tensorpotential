[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorpotential"
version = "0.6.1"
authors = [
    { name = "Anton Bochkarev", email = "anton.bochkarev@rub.de" },
    { name = "Yury Lysogorskiy", email = "yury.lysogorskiy@rub.de" },
]
description = "Graph Atomic Cluster Expansion (GRACE)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Academic Software License (ASL)" }
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # TensorFlow-free base (D12): every dependency except TensorFlow, which comes with the 'tf' extra
    "scipy",
    "matscipy",
    "numpy<3.0.0",
    "sympy",
    "pandas<3.0.0",
    "ase",
    "pyyaml>=6.0.2",
    "tqdm",
    "requests",
    "questionary>=2.0",
    "rich>=13.0",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
tf = [
    # for windows and macos
    "tensorflow<=2.20; sys_platform == 'win32' or sys_platform == 'darwin'",
    # for linux
    "tensorflow[and-cuda]<=2.20; sys_platform == 'linux'",
]
torch = ["torch>=2.9"]
torch-sim = ["tensorpotential[torch]", "torch-sim-atomistic", "vesin"]
dashboard = ["flask"]  # grace_dashboard
all = ["tensorpotential[tf,torch,torch-sim,dashboard]"]

[project.urls]
"Homepage" = "https://github.com/ICAMS/grace-tensorpotential"

[project.scripts]
grace = "tensorpotential.scripts.grace:main"
gracemaker = "tensorpotential.scripts.gracemaker:main"
grace_models = "tensorpotential.scripts.grace_models:main"
grace_collect = "tensorpotential.scripts.grace_collect:main"
extxyz2df = "tensorpotential.scripts.extxyz2df:main"
df2extxyz = "tensorpotential.scripts.df2extxyz:main"
grace_preprocess = "tensorpotential.scripts.grace_preprocess:main"
grace_predict = "tensorpotential.scripts.grace_predict:main"
grace_utils = "tensorpotential.scripts.grace_utils:main"
grace_uq = "tensorpotential.scripts.grace_uq:main"
grace_dashboard = "tensorpotential.scripts.grace_dashboard:main"

[tool.setuptools.packages.find]
include = ["tensorpotential*"]

[tool.setuptools.package-data]
tensorpotential = ["resources/input_template.yaml"]

[tool.ruff]
# One ruff configuration for the whole repository (D13). The strict set of the new packages is selected
# below and switched off for everything else by per-file-ignores, so legacy code is checked as before
# (E, F, plus ERA001 which tools/lint_ratchet.py keeps from rising). Add a new package to the NEW_PACKAGES
# glob and to NEW_PACKAGES in tools/lint_ratchet.py.
per-file-target-version = { "{tensorpotential/torch_backend,tensorpotential/core,tests_torch}/**" = "py312" }

[tool.ruff.lint]
select = [
    "E", "F",
    "I", "UP", "B", "SIM", "C4", "RUF", "PD", "NPY", "PIE", "PLE", "PLW", "PERF", "RET", "PTH",
    "T20", "ERA", "W",
    "C90",     # complexity
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # returns, branches, arguments, statements
    "D",       # numpy convention, public API
    "BLE", "TRY", "S", "ARG", "A",
    "TD", "FIX",  # a TODO must link an issue
]
# E501: line length is handled by the formatter, not enforced here.
# E741, N806, N803: `l` is the angular-momentum quantum number throughout the codebase
# (spherical harmonics, lmax, ...); physics names are deliberate. PLR2004: physics code has constants.
ignore = ["E501", "E741", "N806", "N803", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Everything outside the new packages: the strict families are off (E, F and ERA001 stay on), which keeps a plain
# `ruff check` quiet on legacy code. tools/lint_ratchet.py drops this entry and decides by baselines/legacy_files.txt:
# a file in neither that list nor a new package gets the whole strict set, a legacy file keeps counted findings.
"!{tensorpotential/torch_backend,tensorpotential/core,tests_torch}/**" = [
    "I", "UP", "B", "SIM", "C4", "RUF", "PD", "NPY", "PIE", "PLE", "PLW", "PERF", "RET", "PTH",
    "T20", "W", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "D", "BLE", "TRY", "S", "ARG",
    "A", "TD", "FIX",
]
# New tests: no docstrings, plain asserts. The tests of the legacy directories too: a test file that is not in
# baselines/legacy_files.txt is checked by tools/lint_ratchet.py with the whole strict set except these two.
"{tests_torch,tests,tools/tests}/**" = ["D", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[dependency-groups]
dev = [
    "tensorpotential[tf,dashboard]",  # the test suite runs on the TensorFlow stack; grace_dashboard needs flask
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",  # per-test limit in CI: a hang becomes a failing test, not a dead runner (CI2)
    "pytest-split",    # shards the TensorFlow suite by measured duration (CI2)
    "import-linter",
    "deptry",  # declared against imported dependencies (DEPS4)
    "vulture",  # dead-code ratchet behind tools/dead_code.py (DEPS4)
    "ruff==0.16.7",
    "ty==0.0.84",  # pre-1.0: rules change between releases, bump on purpose
]

# Lint and type ratchet (D13). tools/lint_ratchet.py keeps the legacy ruff and ty counts from rising
# (baselines/lint_ratchet.json); the new packages must have no finding.
[tool.ty.environment]
python = "./.venv"

[[tool.ty.overrides]]
include = ["tensorpotential/**", "tests/**"]
exclude = ["tensorpotential/torch_backend/**", "tensorpotential/core/**"]

[tool.ty.overrides.rules]
invalid-parameter-default = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"

[tool.coverage.run]
branch = true
source = ["tensorpotential"]
# fail_under is set per package in CI: quality-gates of tests.yaml holds core/ and torch_backend/ at 90 (TORCH1)

# Import contract (D1, D16, R2): the TensorFlow-free modules never reach tensorflow or keras, directly or through
# another module of the package. tests/test_import_gates.py runs `lint-imports` and fails when tensorpotential.torch_backend
# exists but is not in source_modules. To change the allowlist (ignore_imports), say why.
[tool.importlinter]
root_package = "tensorpotential"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "TensorFlow-free modules do not import TensorFlow, not even indirectly"
type = "forbidden"
source_modules = [
    "tensorpotential.core",
    "tensorpotential.torch_backend",
    "tensorpotential.constants",
    "tensorpotential.errors",
    "tensorpotential.poly",
    "tensorpotential.functions.couplings",
    "tensorpotential.calculator.foundation_models",
    "tensorpotential.scripts.grace",
    "tensorpotential.scripts.grace_uq",
    "tensorpotential.cli.console",
    "tensorpotential.cli.prompts",
]
forbidden_modules = ["tensorflow", "keras"]
# The allowlist of modules that may cross is empty for core, and for torch_backend once it exists (the TF-side
# extractor lives in tensorpotential/scripts). One import is allowed: grace_fm imports the TF calculator inside
# the function, when a model is loaded, never at import time; and the package __init__ imports tensorflow only inside
# _configure_tf_options, which runs when a TensorFlow-side module imports tensorpotential._tf_options (the TensorFlow-free
# modules above never do).
ignore_imports = [
    "tensorpotential.calculator.foundation_models -> tensorpotential.calculator.asecalculator",
    "tensorpotential -> tensorflow",
]

# Not listed: the command layers themselves, compat (legacy, out of scope), resources (data files) and the package marker
# modules; tests/test_import_direction.py checks that every other top-level module is listed.
[[tool.importlinter.contracts]]
name = "Library code does not import the command layers (cli, scripts)"
type = "forbidden"
source_modules = [
    "tensorpotential.calculator",
    "tensorpotential.constants",
    "tensorpotential.core",
    "tensorpotential.data",
    "tensorpotential.errors",
    "tensorpotential.export",
    "tensorpotential.export_kokkos",
    "tensorpotential.extra",
    "tensorpotential.formatting",
    "tensorpotential.functions",
    "tensorpotential.instructions",
    "tensorpotential.keras_adapter",
    "tensorpotential.loss",
    "tensorpotential.metadata_utils",
    "tensorpotential.metrics",
    "tensorpotential.model_ops",
    "tensorpotential.optimizer_layout",
    "tensorpotential.poly",
    "tensorpotential.potentials",
    "tensorpotential.tensorpot",
    "tensorpotential.torch_backend",
    "tensorpotential.tpmodel",
    "tensorpotential.uq",
    "tensorpotential.utils",
]
forbidden_modules = ["tensorpotential.cli", "tensorpotential.scripts"]
# The input wizard of the gen_tensor model generator is interactive command code that sits in extra/; it imports the
# prompt helpers of cli/ inside its functions.
ignore_imports = [
    "tensorpotential.extra.gen_tensor.wizard -> tensorpotential.cli.prompts",
]

# Layer contracts (ARCH1). The library is not a strict stack (see the finding on the issue: tpmodel and uq import each other,
# and in-function imports close a larger cycle), so each contract states one direction that holds today.
[[tool.importlinter.contracts]]
name = "Foundation modules import nothing above them"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "tensorpotential.constants",
    "tensorpotential.core",
    "tensorpotential.errors",
    "tensorpotential.formatting",
    "tensorpotential.functions",
    "tensorpotential.keras_adapter",
    "tensorpotential.metadata_utils",
    "tensorpotential.metrics",
    "tensorpotential.optimizer_layout",
    "tensorpotential.poly",
]
forbidden_modules = [
    "tensorpotential.calculator",
    "tensorpotential.data",
    "tensorpotential.export",
    "tensorpotential.export_kokkos",
    "tensorpotential.extra",
    "tensorpotential.instructions",
    "tensorpotential.loss",
    "tensorpotential.model_ops",
    "tensorpotential.potentials",
    "tensorpotential.tensorpot",
    "tensorpotential.tpmodel",
    "tensorpotential.uq",
    "tensorpotential.utils",
]

[[tool.importlinter.contracts]]
name = "Instructions and data do not import the model layers"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "tensorpotential.data",
    "tensorpotential.instructions",
]
forbidden_modules = [
    "tensorpotential.calculator",
    "tensorpotential.export_kokkos",
    "tensorpotential.extra",
    "tensorpotential.model_ops",
    "tensorpotential.potentials",
    "tensorpotential.tensorpot",
    "tensorpotential.tpmodel",
    "tensorpotential.uq",
]
# Two functions sit above the layer they live in; each builds a model on purpose, and moving them is a decision for the
# owner of the file (findings on ARCH1): data.datasets loads a foundation model into a TensorPotential and a TPCalculator
# to align energies, instruction_graph_utils builds the two-layer TPModel of an instruction graph.
ignore_imports = [
    "tensorpotential.data.datasets -> tensorpotential.calculator.asecalculator",
    "tensorpotential.data.datasets -> tensorpotential.tensorpot",
    "tensorpotential.instructions.instruction_graph_utils -> tensorpotential.tpmodel",
]

# Layers of the torch backend (R2, TORCH1), top to bottom; a layer imports only the layers below it, also indirectly.
# Siblings joined by | do not import each other: the executor (model) never imports a concrete twin (instructions) and
# knows them through the protocol only; convert is the one layer that knows both.
[[tool.importlinter.contracts]]
name = "Torch backend layers: core, errors, spec, plans and weights, ops and protocol, instructions and model, convert, torchsim"
type = "layers"
layers = [
    "tensorpotential.torch_backend.torchsim",
    "tensorpotential.torch_backend.convert",
    "tensorpotential.torch_backend.model | tensorpotential.torch_backend.instructions",
    "tensorpotential.torch_backend.ops | tensorpotential.torch_backend.protocol",
    "tensorpotential.torch_backend.plans | tensorpotential.torch_backend.weights",
    "tensorpotential.torch_backend.spec",
    "tensorpotential.torch_backend.errors",
    "tensorpotential.core",
]

# The layers below the ops are pure numpy (R2): plans are pure functions, weights read files. The protocol is not listed:
# it imports torch for type checking only, which tests_torch/test_package_structure.py checks at run time.
[[tool.importlinter.contracts]]
name = "Torch-free layers of the backend do not import torch"
type = "forbidden"
source_modules = [
    "tensorpotential.core",
    "tensorpotential.torch_backend.errors",
    "tensorpotential.torch_backend.spec",
    "tensorpotential.torch_backend.plans",
    "tensorpotential.torch_backend.weights",
]
forbidden_modules = ["torch", "torch_sim"]

# Declared against imported dependencies (DEPS4): `deptry tensorpotential` must exit 0. Every entry says why it is not a finding.
[tool.deptry.per_rule_ignores]
# pyace is the optional ACE package that compat/pace imports (legacy, out of scope for every issue)
DEP001 = ["pyace"]
# extras of the torch backend: torch_backend/ imports them once its instructions land (TORCH issues); vesin is imported by
# core/neighbours.py only when its backend is asked for (NBR1)
DEP002 = ["torch", "torch-sim-atomistic"]
# matplotlib comes with ase (plots of the utils, the dataset plotter and the UQ thresholds), keras and absl with the tf extra;
# declaring them would be a new runtime dependency, which is a decision of the owner
DEP003 = ["matplotlib", "keras", "absl"]
