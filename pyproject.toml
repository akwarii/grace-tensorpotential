[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorpotential"
version = "0.6.1"
authors = [
    { name = "Anton Bochkarev", email = "anton.bochkarev@rub.de" },
    { name = "Yury Lysogorskiy", email = "yury.lysogorskiy@rub.de" },
]
description = "Graph Atomic Cluster Expansion (GRACE)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Academic Software License (ASL)" }
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # TensorFlow-free base (D12): every dependency except TensorFlow, which comes with the 'tf' extra
    "scipy",
    "matscipy",
    "numpy<3.0.0",
    "sympy",
    "pandas<3.0.0",
    "ase",
    "pyyaml>=6.0.2",
    "tqdm",
    "requests",
    "questionary>=2.0",
    "rich>=13.0",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
tf = [
    # for windows and macos
    "tensorflow<=2.20; sys_platform == 'win32' or sys_platform == 'darwin'",
    # for linux
    "tensorflow[and-cuda]<=2.20; sys_platform == 'linux'",
]
torch = ["torch"]
torch-sim = ["tensorpotential[torch]", "torch-sim-atomistic", "vesin"]
all = ["tensorpotential[tf,torch,torch-sim]"]

[project.urls]
"Homepage" = "https://github.com/ICAMS/grace-tensorpotential"

[project.scripts]
gracemaker = "tensorpotential.scripts.gracemaker:main"
grace_models = "tensorpotential.scripts.grace_models:main"
grace_collect = "tensorpotential.scripts.grace_collect:main"
extxyz2df = "tensorpotential.scripts.extxyz2df:main"
df2extxyz = "tensorpotential.scripts.df2extxyz:main"
grace_preprocess = "tensorpotential.scripts.grace_preprocess:main"
grace_predict = "tensorpotential.scripts.grace_predict:main"
grace_utils = "tensorpotential.scripts.grace_utils:main"
grace_uq = "tensorpotential.scripts.grace_uq:main"
grace_dashboard = "tensorpotential.scripts.grace_dashboard:main"

[tool.setuptools.packages.find]
include = ["tensorpotential*"]

[tool.setuptools.package-data]
tensorpotential = ["resources/input_template.yaml"]

[tool.ruff]
# One ruff configuration for the whole repository (D13). The strict set of the new packages is selected
# below and switched off for everything else by per-file-ignores, so legacy code is checked as before
# (E, F, plus ERA001 which tools/lint_ratchet.py keeps from rising). Add a new package to the NEW_PACKAGES
# glob and to NEW_PACKAGES in tools/lint_ratchet.py.
per-file-target-version = { "{tensorpotential/torch_backend,tensorpotential/core,tests_torch}/**" = "py311" }

[tool.ruff.lint]
select = [
    "E", "F",
    "I", "UP", "B", "SIM", "C4", "RUF", "PD", "NPY", "PIE", "PLE", "PLW", "PERF", "RET", "PTH",
    "T20", "ERA", "W",
    "C90",     # complexity
    "PLR0911", "PLR0912", "PLR0913", "PLR0915",  # returns, branches, arguments, statements
    "D",       # numpy convention, public API
    "BLE", "TRY", "S", "ARG", "A",
    "TD", "FIX",  # a TODO must link an issue
]
# E501: line length is handled by the formatter, not enforced here.
# E741, N806, N803: `l` is the angular-momentum quantum number throughout the codebase
# (spherical harmonics, lmax, ...); physics names are deliberate. PLR2004: physics code has constants.
ignore = ["E501", "E741", "N806", "N803", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Everything outside the new packages: the strict families are off (E, F and ERA001 stay on).
"!{tensorpotential/torch_backend,tensorpotential/core,tests_torch}/**" = [
    "I", "UP", "B", "SIM", "C4", "RUF", "PD", "NPY", "PIE", "PLE", "PLW", "PERF", "RET", "PTH",
    "T20", "W", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "D", "BLE", "TRY", "S", "ARG",
    "A", "TD", "FIX",
]
# New tests: no docstrings, plain asserts.
"tests_torch/**" = ["D", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[dependency-groups]
dev = [
    "tensorpotential[tf]",  # the test suite runs on the TensorFlow stack
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",  # per-test limit in CI: a hang becomes a failing test, not a dead runner (CI2)
    "pytest-split",    # shards the TensorFlow suite by measured duration (CI2)
    "import-linter",
    "ruff==0.16.7",
    "ty==0.0.84",  # pre-1.0: rules change between releases, bump on purpose
]

# Lint and type ratchet (D13). tools/lint_ratchet.py keeps the legacy ruff and ty counts from rising
# (baselines/lint_ratchet.json); the new packages must have no finding.
[tool.ty.environment]
python = "./.venv"

[[tool.ty.overrides]]
include = ["tensorpotential/**", "tests/**"]
exclude = ["tensorpotential/torch_backend/**", "tensorpotential/core/**"]

[tool.ty.overrides.rules]
invalid-parameter-default = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"

[tool.coverage.run]
branch = true
source = ["tensorpotential"]
# fail_under is set per package in CI (M2.1)

# Import contract (D1, D16, R2): the TensorFlow-free modules never reach tensorflow or keras, directly or through
# another module of the package. tests/test_import_gates.py runs `lint-imports` and fails when tensorpotential.torch_backend
# exists but is not in source_modules. To change the allowlist (ignore_imports), say why.
[tool.importlinter]
root_package = "tensorpotential"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "TensorFlow-free modules do not import TensorFlow, not even indirectly"
type = "forbidden"
source_modules = [
    "tensorpotential.core",
    "tensorpotential.torch_backend",
    "tensorpotential.constants",
    "tensorpotential.poly",
    "tensorpotential.functions.couplings",
    "tensorpotential.calculator.foundation_models",
]
forbidden_modules = ["tensorflow", "keras"]
# The allowlist of modules that may cross is empty for core, and for torch_backend once it exists (the TF-side
# extractor lives in tensorpotential/scripts). One import is allowed: grace_fm imports the TF calculator inside
# the function, when a model is loaded, never at import time; and the package __init__ imports tensorflow only inside
# _configure_tf_options, which runs when a TensorFlow-side module imports tensorpotential._tf_options (the TensorFlow-free
# modules above never do).
ignore_imports = [
    "tensorpotential.calculator.foundation_models -> tensorpotential.calculator.asecalculator",
    "tensorpotential -> tensorflow",
]
