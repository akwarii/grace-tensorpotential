# Divergence ledger (BOARD2, D17 b): one row per file of upstream/master that the fork modifies or deletes.
# Files the fork only adds (the fork-only paths of tools/check_pr_branch.py, tests, packages) need no row.
# tools/divergence.py check recomputes the list from `git diff --name-only --no-renames --diff-filter=MD upstream/master...HEAD`
# and fails on a modified file without a row and on a row whose file no longer differs from upstream.
#   path       the file, relative to the repository root
#   reason     why the fork differs, in one sentence
#   milestone  the issue ids whose merged pull requests changed it
#   upstream   pending (could be offered, not yet), merged (offered and merged, the row goes when the fork takes the upstream file),
#              or never (depends on fork-only code or is a fork policy); the owner decides, a new row starts as pending

